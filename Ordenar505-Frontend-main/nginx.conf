server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Static assets — cache forever (Vite hashes filenames)
  location ~* \.(?:js|css|woff2?|ttf|eot|otf|svg|jpg|jpeg|png|gif|webp|ico)$ {
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Socket.IO — needs long-poll + WebSocket upgrade
  location /socket.io/ {
    proxy_pass         http://backend:8000/socket.io/;
    proxy_http_version 1.1;
    proxy_set_header   Upgrade $http_upgrade;
    proxy_set_header   Connection "upgrade";
    proxy_set_header   Host $host;
    proxy_cache_bypass $http_upgrade;
    proxy_read_timeout 86400s;
  }

  # API reverse proxy (optional — only used when both services share a domain)
  location /api/ {
    proxy_pass         http://backend:8000/api/;
    proxy_http_version 1.1;
    proxy_set_header   Host $host;
    proxy_set_header   X-Real-IP $remote_addr;
    proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
  }

  # SPA fallback
  location / {
    try_files $uri /index.html;
  }
}
