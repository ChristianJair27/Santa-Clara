services:

  backend:
    build:
      context: ./Ordenar505-Backend-main
      dockerfile: Dockerfile
    container_name: santa-clara-backend
    restart: unless-stopped
    expose:
      - "8000"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.santa-clara-api.rule=Host(`${SERVICE_FQDN_BACKEND}`)"
      - "traefik.http.routers.santa-clara-api.entrypoints=https"
      - "traefik.http.routers.santa-clara-api.tls=true"
      - "traefik.http.routers.santa-clara-api.tls.certresolver=letsencrypt"
      - "traefik.http.services.santa-clara-api.loadbalancer.server.port=8000"
    environment:
      NODE_ENV: production
      PORT: 8000
      ACCESS_TOKEN_SECRET: ${ACCESS_TOKEN_SECRET}
      DB_HOST: ${DB_HOST}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
    volumes:
      - uploads_data:/app/public/uploads
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8000/"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 40s

  frontend:
    build:
      context: ./Ordenar505-Frontend-main
      dockerfile: Dockerfile
      args:
        VITE_BACKEND_URL: ${VITE_BACKEND_URL:-http://localhost:8000}
    container_name: santa-clara-frontend
    restart: unless-stopped
    expose:
      - "80"
    depends_on:
      backend:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.santa-clara.rule=Host(`${SERVICE_FQDN_FRONTEND}`)"
      - "traefik.http.routers.santa-clara.entrypoints=https"
      - "traefik.http.routers.santa-clara.tls=true"
      - "traefik.http.routers.santa-clara.tls.certresolver=letsencrypt"
      - "traefik.http.services.santa-clara.loadbalancer.server.port=80"

volumes:
  uploads_data:
